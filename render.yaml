services:
  - type: web
    name: ca-smartpro-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build --workspace=apps/api && npx prisma migrate deploy --schema apps/api/prisma/schema.prisma && npx tsx apps/api/prisma/seed.ts
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ca-smartpro-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      # Set to your Vercel frontend URL(s), comma-separated, no trailing slash.
      # e.g. https://ca-smartpro-web.vercel.app,https://your-custom-domain.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Optional — leave unset to disable AI Copilot rather than fake responses.
      - key: AI_API_KEY
        sync: false

databases:
  - name: ca-smartpro-db
    plan: free
    region: oregon
